<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Etkinlik Ekle</title>
</head>
<body>
    <!-- Başlık ve Menü[cite: 4] -->
    <h1>Etkinlik Ekle</h1>
    <nav>
        <a href="index.html">Ana Sayfa</a> 
        <a href="index.html">Liste</a> 
        <a href="etkinlik-ekle.html">Ekle</a> 
        <a href="etkinlik-guncelle.html">Güncelle</a>
    </nav>

    <br>

    <!-- Veri Ekleme Formu[cite: 4] -->
    <form action="#" method="POST">
        <div>
            <label for="etkinlikAdi">Etkinlik Adı</label><br>
            <input type="text" id="etkinlikAdi" name="etkinlikAdi" required>
        </div>
        <br>
        
        <div>
            <label for="kategori">Kategori</label><br>
            <select id="kategori" name="kategori" required>
                <option value="Seminer">Seminer</option>
                <option value="Atölye">Atölye</option>
            </select>
        </div>
        <br>
        
        <div>
            <label for="tarih">Tarih</label><br>
            <!-- gg.aa.yyyy formatını tarayıcı type="date" ile otomatik sağlar[cite: 4] -->
            <input type="date" id="tarih" name="tarih" required> 
        </div>
        <br>
        
        <div>
            <label for="aciklama">Açıklama</label><br>
            <textarea id="aciklama" name="aciklama" rows="4" required></textarea>
        </div>
        <br>
        
        <button type="submit">Kaydet</button>
    </form>
</body>
</html>
