<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Ekle</title>
    <link rel="stylesheet" href="css/2321032051.css">
    <script type="module" src="js/event-form.js"></script>
</head>
<body>
    <!-- Başlık ve Menü[cite: 4] -->
    <h1>Etkinlik Ekle</h1>
    <nav>
        <a href="index.html">Ana Sayfa</a> 
        <a href="etkinlikler.html">Etkinlikler</a> 
        <a href="etkinlik-ekle.html">Ekle</a> 
    </nav>

    <br>

    <!-- Veri Ekleme Formu[cite: 4] -->
    <form id="etkinlik-formu">
        <div>
            <label>Etkinlik Adı *</label>
            <input type="text" name="title" required>
        </div>
        <div>
            <label>Kategori *</label>
            <select name="category" required>
                <option value="">Seçiniz</option>
                <option value="Seminer">Seminer</option>
                <option value="Atölye">Atölye</option>
                <option value="Söyleşi">Söyleşi</option>
            </select>
        </div>
        <div>
            <label>Tarih *</label>
            <input type="date" name="date" required>
        </div>
        <div>
            <label>Saat *</label>
            <input type="time" name="time" required>
        </div>
        <div>
            <label>Yer *</label>
            <input type="text" name="location" placeholder="Örn. A Blok Konferans Salonu" required>
        </div>
        <div>
            <label>Kontenjan</label>
            <input type="number" name="capacity">
        </div>
        <div>
            <label>Açıklama</label>
            <textarea name="description"></textarea>
        </div>
        <button type="submit" style="margin-top: 15px; padding: 10px 20px; background-color: #2b7a2b; color: white; border: none; border-radius: 5px; cursor: pointer;">Kaydet</button>
    </form>
</body>
</html>
